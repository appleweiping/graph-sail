[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "graph-sail"
version = "0.1.0"
description = "Deterministic placement and scheduling for heterogeneous multimodal DAGs"
readme = "README.md"
requires-python = ">=3.11"
license = { file = "LICENSE" }
authors = [{ name = "Graph Sail contributors" }]
keywords = ["multimodal", "inference", "scheduling", "placement", "dag"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Topic :: System :: Distributed Computing",
]

[project.urls]
Homepage = "https://github.com/appleweiping/graph-sail"
Repository = "https://github.com/appleweiping/graph-sail"
Issues = "https://github.com/appleweiping/graph-sail/issues"

[project.optional-dependencies]
dev = ["coverage[toml]>=7.6", "pytest>=8", "ruff>=0.8"]

[project.scripts]
graph-sail = "graph_sail.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
addopts = "-ra"
testpaths = ["tests"]

[tool.coverage.run]
branch = true
source = ["graph_sail"]

[tool.coverage.report]
fail_under = 94
show_missing = true

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "RUF", "SIM", "C4", "PIE"]
