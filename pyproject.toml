[build-system]
requires = ["setuptools==84.0.0"]
build-backend = "setuptools.build_meta"

[project]
name = "graph-sail"
version = "0.2.0"
description = "Deterministic placement and scheduling for heterogeneous multimodal DAGs"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "appleweiping" }]
maintainers = [{ name = "appleweiping" }]
keywords = ["multimodal", "inference", "scheduling", "placement", "dag"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Topic :: System :: Distributed Computing",
  "Typing :: Typed",
]

[project.urls]
Homepage = "https://github.com/appleweiping/graph-sail"
Repository = "https://github.com/appleweiping/graph-sail"
Issues = "https://github.com/appleweiping/graph-sail/issues"

[project.optional-dependencies]
dev = ["build>=1.2", "coverage[toml]>=7.6", "mypy>=1.15", "pytest>=8", "ruff>=0.8", "twine>=7.0"]

[project.scripts]
graph-sail = "graph_sail.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
graph_sail = ["py.typed"]

[tool.pytest.ini_options]
addopts = "-ra"
testpaths = ["tests"]

[tool.coverage.run]
branch = true
source = ["graph_sail"]

[tool.coverage.report]
fail_under = 95
show_missing = true

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "RUF", "SIM", "C4", "PIE"]

[tool.mypy]
python_version = "3.11"
strict = true
files = ["src"]
