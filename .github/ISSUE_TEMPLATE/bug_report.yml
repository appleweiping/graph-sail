name: Bug report
description: Report reproducible incorrect behavior
title: "[bug] "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: Thanks for helping make Graph Sail more reliable.
  - type: textarea
    id: description
    attributes:
      label: What happened?
      description: Include the observed and expected placement, schedule, or validation result.
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Minimal reproduction
      description: Paste a minimal graph JSON and the exact command.
      render: shell
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version and Python
      placeholder: Graph Sail 0.1.0, Python 3.12.4
    validations:
      required: true
