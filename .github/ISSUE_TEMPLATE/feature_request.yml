name: Feature request
description: Propose a focused graph, cost-model, or reporting improvement
title: "[feature] "
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What planning decision cannot be represented or audited today?
    validations:
      required: true
  - type: textarea
    id: semantics
    attributes:
      label: Proposed semantics
      description: Explain inputs, output, determinism, and cost-model assumptions.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
